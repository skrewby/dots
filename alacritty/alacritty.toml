[env]
TERM = "xterm-256color"

[general]
import = [
    "~/.config/alacritty/catppuccin-mochal.toml"
]

[window]
padding.x = 10
padding.y = 10

[font]
size = 13.0

[font.normal]
family = "Hack Nerd Font Mono"
style = "Regular"

[font.bold]
family = "Hack Nerd Font Mono"
style = "Bold"

[font.bold_italic]
family = "Hack Nerd Font Mono"
style = "Bold Italic"

[font.italic]
family = "Hack Nerd Font Mono"
style = "Italic"
