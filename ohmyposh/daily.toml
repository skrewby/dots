version = 3
final_space = true

[secondary_prompt]
  template = '❯❯ '
  foreground = 'cyan'

[transient_prompt]
  template = '❯ '
  foreground = 'cyan'

[[blocks]]
  type = 'prompt'
  alignment = 'left'

  [[blocks.segments]]
    template = '┏[{{ .UserName }}]'
    foreground = 'cyan'
    type = 'session'
    style = 'plain'

    [blocks.segments.properties]
      cache_duration = 'none'

  [[blocks.segments]]
    template = '[<white>{{ .UpstreamIcon }}</> {{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }} <white></> {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }} <white></> {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }} <white></> {{ .StashCount }}{{ end }}]'
    foreground = 'magenta'
    type = 'git'
    style = 'plain'

    [blocks.segments.properties]
      cache_duration = 'none'
      fetch_stash_count = true
      fetch_status = true
      fetch_upstream_icon = true

  [[blocks.segments]]
    template = '[{{ .Path }}</>]'
    foreground = 'cyan'
    type = 'path'
    style = 'plain'

    [blocks.segments.properties]
      cache_duration = 'none'
      style = 'full'

[[blocks]]
  type = 'prompt'
  alignment = 'right'

  [[blocks.segments]]
    template = '[<white></> {{ .FormattedMs }}s]'
    foreground = 'lightRed'
    type = 'executiontime'
    style = 'diamond'

    [blocks.segments.properties]
      cache_duration = 'none'
      style = 'dallas'
      threshold = 5.0

[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    template = '┗'
    foreground = 'cyan'
    type = 'text'
    style = 'plain'

    [blocks.segments.properties]
      cache_duration = 'none'
